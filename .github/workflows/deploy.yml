name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish JyunoWeb.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          site=publish/wwwroot
          # 프로젝트 페이지는 /<저장소 이름>/ 아래에서 서비스되므로 base 경로를 맞춤
          base="/${{ github.event.repository.name }}/"
          sed -i "s#<base href=\"/\" />#<base href=\"$base\" />#" $site/index.html
          rm -f $site/index.html.br $site/index.html.gz
          # 새로고침이나 직접 링크(/playground 등)도 앱이 처리하도록
          cp $site/index.html $site/404.html
          touch $site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
