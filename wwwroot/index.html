<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jyuno · C# 앱을 위한 작고 안전한 스크립트 언어</title>
    <meta name="description" content="Jyuno는 C# 프로그램에 안전한 플러그인 기능을 쉽게 추가하기 위한 작고 가벼운 스크립트 언어입니다. 브라우저에서 바로 실행해 보세요." />
    <meta property="og:title" content="Jyuno" />
    <meta property="og:description" content="C# 앱에 안전한 플러그인을 붙이는 작은 언어. 브라우저 플레이그라운드에서 바로 실행해 보세요." />
    <meta name="theme-color" content="#0b0d17" />
    <base href="/" />
    <script>
        // 테마: 저장한 선택이 있으면 그것을, 없으면 시스템 설정을 따름 (깜빡임 없이 CSS보다 먼저 적용)
        (function () {
            var key = 'jyuno.theme';
            var media = window.matchMedia('(prefers-color-scheme: light)');
            function saved() { try { return localStorage.getItem(key); } catch (e) { return null; } }
            function apply(theme) {
                document.documentElement.dataset.theme = theme;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.content = theme === 'light' ? '#f7f7fb' : '#090a13';
            }
            function current() { return saved() || (media.matches ? 'light' : 'dark'); }
            apply(current());
            media.addEventListener('change', function () { if (!saved()) apply(current()); });
            window.jyunoTheme = {
                get: current,
                set: function (theme) {
                    var root = document.documentElement;
                    root.classList.add('theme-anim');
                    try { localStorage.setItem(key, theme); } catch (e) { }
                    apply(theme);
                    setTimeout(function () { root.classList.remove('theme-anim'); }, 300);
                    return theme;
                },
                toggle: function () { return this.set(current() === 'light' ? 'dark' : 'light'); }
            };
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <link rel="stylesheet" href="css/app.css" />

</head>
